name: ci
on:
  push: { branches: [main, "feat/**"] }
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: vet
        run: |
          if find . -name '*.go' -not -path './android/*' | grep -q .; then go vet ./...; else echo "no go sources yet"; fi
      - name: test
        run: |
          if find . -name '*.go' -not -path './android/*' | grep -q .; then go test ./... -count=1 -short; else echo "no go sources yet"; fi
